[build]
target = "riscv32imafc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
runner = "espflash flash --monitor --bootloader target/riscv32imafc-esp-espidf/release/bootloader.bin"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32p4"
ESP_IDF_VERSION = "v6.0.3"
ESP_IDF_TOOLS_INSTALL_DIR = "workspace"
